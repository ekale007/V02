<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Robot Arm — Controls (2D)</title>
  <style>
    body{font-family:Inter,Segoe UI,Arial,sans-serif;background:#0b1220;color:#e6f6ff;margin:0;padding:12px}
    #topBar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .header-status{font-weight:600}
    #controls{width:420px;display:inline-block;vertical-align:top}
    #main{display:flex;align-items:flex-start;justify-content:center;gap:16px}
    #sideSchematic{display:flex;align-items:center;justify-content:center;margin-left:16px}
    .control-card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:8px;border-radius:6px;margin-bottom:8px}
    .slider-row{display:flex;gap:8px;align-items:center}
    input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:28px;width:100%}
    input[type=range]::-webkit-slider-runnable-track{height:10px;background:#2b6cb0;border-radius:6px}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:16px;width:16px;border-radius:50%;background:#ffd166}
    .angle-val{min-width:48px;text-align:center;font-weight:700}
    button{background:#152238;color:#dff6ff;border:1px solid rgba(255,255,255,0.04);padding:6px 10px;border-radius:6px;cursor:pointer}
    svg{background:#06111a;border-radius:6px;display:block;margin:auto}
  </style>
</head>
<body>
  <div id="topBar">
    <div style="display:flex;align-items:center;gap:8px">
      <button id="setupBtn" title="Setup" style="font-size:18px;padding:6px;border-radius:6px">⚙️</button>
      <div>
        <div id="siteTitle">Robot Arm</div>
        <div class="header-status" id="headerStatus" title="Status">—</div>
      </div>
    </div>
    <div id="topCenter" style="display:flex;align-items:center;justify-content:center;gap:8px">
      <label style="font-size:13px;color:#9fb2c8;margin:0">Speed</label>
      <select id="globalSpeedSel" style="padding:6px;border-radius:6px;background:#06111a;color:#e6f6ff;border:1px solid rgba(255,255,255,0.04)">
        <option value="slow">Slow</option>
        <option value="medium" selected>Medium</option>
        <option value="fast">Fast</option>
      </select>
    </div>
      <div style="display:flex;gap:8px;align-items:center">
      <button id="libraryBtn">Library</button>
      <button id="storePosBtn" title="Save" style="font-size:16px;padding:6px;border-radius:6px">💾</button>
      <button id="modeToggleBtn">Mode: Simulation</button>
      <button id="homeBtn" title="Home" style="font-size:16px;padding:6px;border-radius:6px">🏠</button>
      <button id="emergencyBtn" title="Emergency" style="background:#b43535;color:white;padding:6px 10px;border-radius:6px">⛔</button>
    </div>
  </div>

  <div id="main">
    <div id="controls">
      <div id="controlsList"></div>
    </div>
    <div id="sideSchematic">
      <svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
        <g id="schemRoot"></g>
      </svg>
    </div>
  </div>

  <!-- 3D viewer removed to restore 2D-only UI -->

  <script>
    (function(){
      // client-side servo map placeholder (2D UI — no server-injected map)
      const SERVO_MAP = {};
    // Minimal, safe 2D-only UI — no external modules.
    const JOINT_ORDER = ['base','shoulder','elbow','wrist','hand'];
    const DEFAULT_POS = { base:90, shoulder:90, elbow:90, wrist:90, hand:0 };
    try{ window.latestPositions = Object.assign({}, DEFAULT_POS, JSON.parse(localStorage.getItem('simPositions')||'{}')); }catch(_){ window.latestPositions = Object.assign({}, DEFAULT_POS); }
    try{ window.IS_LIVE = false; }catch(_){ window.IS_LIVE = false; }

    // Server now handles reverse mapping; client sends UI angles and expects server to return UI-mapped positions.
    function _applyReverseMapping(joint, angle){ return Math.round(angle); }
    function _mapFromServer(joint, serverAngle){ return Math.round(serverAngle); }

    function sendTarget(joint, angle, speed, speed_mode){
      // lightweight live update: set a persistent server-side target to avoid queue churn
      try{ if(!window.IS_LIVE) return; }catch(_){ return; }
      try{
        const body = { joint: joint, angle: Math.round(angle) };
        if(typeof speed !== 'undefined' && speed !== null) body.speed = speed;
        if(typeof speed_mode !== 'undefined' && speed_mode !== null) body.speed_mode = speed_mode;
        fetch('/api/set_target', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }).catch(()=>{});
      }catch(_){ }
    }

    function sendMove(joint, angle, speed_mode){
      // final authoritative move — keep existing behavior
      try{ if(!window.IS_LIVE) return; }catch(_){ return; }
      try{ const mapped = _applyReverseMapping(joint, angle); const body = { joint: joint, angle: mapped }; if(typeof speed_mode !== 'undefined' && speed_mode !== null) body.speed_mode = speed_mode; fetch('/api/move', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }).catch(()=>{}); }catch(_){ }
    }

    function drawBarSchematic(){
      try{
        const root = document.getElementById('schemRoot'); if(!root) return; root.innerHTML = '';
        const cfg = (function(){ try{ return JSON.parse(localStorage.getItem('barSchemConfig')||'{}') }catch(_){ return {}; } })();
        const lengths = (cfg.lengths) || { shoulder:80, elbow:70, wrist:50 };
        // center drawing based on the parent SVG size so the arm is centered
        const svg = root.ownerSVGElement || root.parentNode;
        const w = (svg && svg.clientWidth) || parseInt(svg && svg.getAttribute && svg.getAttribute('width')) || 360;
        const h = (svg && svg.clientHeight) || parseInt(svg && svg.getAttribute && svg.getAttribute('height')) || 360;
        let x = Math.round(w/2 - 20), y = Math.round(h/2), angleAccum = 0;
        const __joints = ['shoulder','elbow','wrist'];
        for(let __idx=0; __idx<__joints.length; __idx++){
          const j = __joints[__idx];
          const ang = (window.latestPositions && typeof window.latestPositions[j]==='number')? window.latestPositions[j] : 90;
          const off = (cfg.offsets && typeof cfg.offsets[j]==='number')? cfg.offsets[j] : 0;
          const rel = (ang - 90) + off; angleAccum += rel;
          const L = lengths[j] || 60;
          const style = (cfg.styles && cfg.styles[j]) || 'straight';
          const color = (cfg.colors && cfg.colors[j]) ? cfg.colors[j] : (cfg.color || '#7cc9ff');
          const g = document.createElementNS('http://www.w3.org/2000/svg','g');
          g.setAttribute('transform', `translate(${x},${y}) rotate(${angleAccum})`);
          const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          const barHeight = 12;
          if(style === 'l'){
            rect.setAttribute('x', '0');
            rect.setAttribute('y', String(-Math.round(barHeight/2)));
            rect.setAttribute('width', String(Math.max(6, L)));
            rect.setAttribute('height', String(barHeight));
            rect.setAttribute('fill', color);
            g.appendChild(rect);
            const capThickness = 6;
            const capLength = Math.max(L, 8);
            const cap = document.createElementNS('http://www.w3.org/2000/svg','rect');
            cap.setAttribute('x', String(L - Math.round(capThickness/2)));
            cap.setAttribute('y', String(-Math.round(capLength/2)));
            cap.setAttribute('width', String(capThickness));
            cap.setAttribute('height', String(capLength));
            cap.setAttribute('fill', color);
            g.appendChild(cap);
            const jointStart = document.createElementNS('http://www.w3.org/2000/svg','circle');
            jointStart.setAttribute('cx','0'); jointStart.setAttribute('cy','0'); jointStart.setAttribute('r','3'); jointStart.setAttribute('fill','#ffd166'); jointStart.setAttribute('opacity','0.95');
            g.appendChild(jointStart);
            const jointEnd = document.createElementNS('http://www.w3.org/2000/svg','circle');
            jointEnd.setAttribute('cx', String(L)); jointEnd.setAttribute('cy','0'); jointEnd.setAttribute('r','3'); jointEnd.setAttribute('fill','#ffd166'); jointEnd.setAttribute('opacity','0.95');
            g.appendChild(jointEnd);
            root.appendChild(g);
            const theta = angleAccum * Math.PI/180;
            const advance = L;
            x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
          } else {
            rect.setAttribute('x','0');
            rect.setAttribute('y','-6');
            rect.setAttribute('width', String(Math.max(6,L)));
            rect.setAttribute('height','12'); rect.setAttribute('fill', color);
            g.appendChild(rect);
            root.appendChild(g);
            const theta = angleAccum * Math.PI/180;
            const advance = L;
            x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
          }
        }
        // READY stamp removed to restore minimal schematic
          // draw base footprint at initial center
          try{
            const bf = document.createElementNS('http://www.w3.org/2000/svg','rect');
            const bw = 60; const bh = 36;
            bf.setAttribute('x', String(Math.round((svg.clientWidth||360)/2 - bw/2)));
            bf.setAttribute('y', String(Math.round((svg.clientHeight||360)/2 - bh/2)));
            bf.setAttribute('width', String(bw)); bf.setAttribute('height', String(bh)); bf.setAttribute('fill', 'rgba(255,255,255,0.03)'); bf.setAttribute('stroke','rgba(255,255,255,0.06)');
            root.insertBefore(bf, root.firstChild);
          }catch(e){}
      }catch(e){ console.warn('drawBarSchematic failed', e); }
    }

    /* Calibration modal markup + helpers */
    /* Store Position / Library modal */
    function buildStoreModal(){
      if(document.getElementById('storeModal')) return;
      const div = document.createElement('div'); div.id='storeModal'; div.style.display='none';
      div.innerHTML = `
        <div id="storeOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1200">
          <div style="width:820px;max-width:98%;background:#07121a;padding:12px;border-radius:8px;color:#e6f6ff;position:relative">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <strong>Store Position</strong>
              <div style="display:flex;gap:8px;align-items:center"><button id="storeCloseBtn">Close</button></div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:8px">
              <button class="store-tab" data-tab="save">Save</button>
              <button class="store-tab" data-tab="library">Library</button>
            </div>
            <div id="storeContent" style="max-height:62vh;overflow:auto;padding-right:8px">
              <div id="storePane-save" class="store-pane">
                <div style="display:flex;gap:12px">
                  <div style="width:360px">
                    <svg id="storePreviewSvg" width="360" height="260" style="background:#021216;border-radius:6px"></svg>
                    <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
                      <input id="store_name" placeholder="Position name" style="flex:1;padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.04)">
                      <button id="storeSaveBtn">Save</button>
                      <button id="storeDeleteBtn">Delete</button>
                    </div>
                    <div id="storeMsg" style="font-size:12px;color:#9fb2c8;margin-top:6px"></div>
                  </div>
                  <div style="flex:1">
                    <div style="font-weight:700;margin-bottom:6px">Current angles</div>
                    <pre id="store_positions" style="background:#04141a;padding:8px;border-radius:6px;max-height:360px;overflow:auto"></pre>
                  </div>
                </div>
              </div>
              <div id="storePane-library" class="store-pane" style="display:none">
                <div style="display:flex;gap:12px">
                  <div style="width:360px">
                    <svg id="storePreviewSvgLib" width="360" height="260" style="background:#021216;border-radius:6px"></svg>
                  </div>
                  <div style="flex:1">
                    <div style="font-weight:700;margin-bottom:6px">Saved Positions Library</div>
                    <div id="savedLibrary" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
      document.body.appendChild(div);
      document.getElementById('storeCloseBtn').addEventListener('click', ()=>{ document.getElementById('storeModal').style.display='none'; });
      document.getElementById('storeSaveBtn').addEventListener('click', saveCurrentPosition);
      // export / import UI
      const expBtn = document.createElement('button'); expBtn.id = 'storeExportBtn'; expBtn.textContent = 'Export'; expBtn.style.marginLeft = '6px';
      const impBtn = document.createElement('button'); impBtn.id = 'storeImportBtn'; impBtn.textContent = 'Import'; impBtn.style.marginLeft = '6px';
      const toolsRow = div.querySelector('#storePane-save > div');
      if(toolsRow){
        toolsRow.appendChild(expBtn);
        toolsRow.appendChild(impBtn);
      }

      expBtn.addEventListener('click', async () => {
        try{
          const res = await fetch('/api/saved_positions/export');
          if(res && res.ok){
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'saved_positions_export.json';
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            const msgEl = document.getElementById('storeMsg'); if(msgEl) msgEl.textContent = 'Export started';
          }
        }catch(e){ console.warn(e); const msgEl = document.getElementById('storeMsg'); if(msgEl) msgEl.textContent = 'Export failed'; }
      });

      impBtn.addEventListener('click', () => {
        try{
          const input = document.createElement('input');
          input.type = 'file'; input.accept = 'application/json';
          input.onchange = async (ev) => {
            try{
              const f = ev.target.files[0]; if(!f) return;
              const txt = await f.text();
              let parsed = null;
              try{ parsed = JSON.parse(txt); }catch(e){ const msgEl = document.getElementById('storeMsg'); if(msgEl) msgEl.textContent='Invalid JSON'; return; }
              try{
                const res = await fetch('/api/saved_positions/import', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(parsed) });
                if(res && res.ok){ const msgEl = document.getElementById('storeMsg'); if(msgEl) msgEl.textContent='Import OK'; await renderSavedLibrary(); }
                else{ const msgEl = document.getElementById('storeMsg'); if(msgEl) msgEl.textContent='Import failed'; }
              }catch(e){ console.warn(e); const msgEl = document.getElementById('storeMsg'); if(msgEl) msgEl.textContent='Import error'; }
            }catch(e){ console.warn(e); }
          };
          input.click();
        }catch(e){ console.warn(e); }
      });

      document.getElementById('storeDeleteBtn').addEventListener('click', deleteNamedPosition);

      // header library button opens modal directly on library tab
      try{
        const libBtn = document.getElementById('libraryBtn');
        if(libBtn){
          libBtn.addEventListener('click', ()=>{
            buildStoreModal();
            const modal = document.getElementById('storeModal');
            if(!modal) return;
            modal.style.display = 'block';
            // switch to library tab
            const tab = modal.querySelector('.store-tab[data-tab="library"]');
            if(tab) tab.click();
            renderSavedLibrary();
          });
        }
      }catch(_){ }
      // tab handling
      Array.from(div.querySelectorAll('.store-tab')).forEach(b=>{
        b.addEventListener('click', ()=>{
          const t = b.dataset.tab;
          Array.from(div.querySelectorAll('.store-pane')).forEach(p=> p.style.display = 'none');
          const sel = div.querySelector('#storePane-'+t); if(sel) sel.style.display = '';
          // render previews appropriately
          if(t === 'save'){ try{ renderStorePreview(); }catch(_){ } }
          if(t === 'library'){ try{ renderSavedLibrary(); drawPreview('storePreviewSvgLib', window.latestPositions); }catch(_){ } }
        });
      });
    }

    function openStoreModal(){
      buildStoreModal();
      const modal = document.getElementById('storeModal'); if(!modal) return; modal.style.display='block';
      renderStorePreview(); renderSavedLibrary();
    }

    function renderStorePreview(){
      try{
        const svg = document.getElementById('storePreviewSvg'); if(!svg) return; drawPreview('storePreviewSvg', window.latestPositions);
        const txt = document.getElementById('store_positions'); if(txt) txt.textContent = JSON.stringify(window.latestPositions || {}, null, 2);
      }catch(_){ }
    }

    // Reusable preview drawer — draws a simple 3-link schematic into the SVG with given id
    function drawPreview(svgId, positions, cfgLengths){
      try{
        const root = document.getElementById(svgId); if(!root) return; while(root.firstChild) root.removeChild(root.firstChild);
        // allow svg to preserve aspect and compute center
        try{ root.setAttribute('preserveAspectRatio','xMidYMid meet'); }catch(_){ }
        const cfg = (function(){ try{ return JSON.parse(localStorage.getItem('barSchemConfig')||'{}') }catch(_){ return {}; } })();
        const lengths = cfgLengths || (cfg.lengths) || { shoulder:80, elbow:70, wrist:50 };
        const w = root.clientWidth || parseInt(root.getAttribute('width')) || 360;
        const h = root.clientHeight || parseInt(root.getAttribute('height')) || 260;
        let x = Math.round(w/2 - 20), y = Math.round(h/2), angleAccum = 0;
        ['shoulder','elbow','wrist'].forEach((j, idx)=>{
          const ang = (positions && typeof positions[j]==='number')? positions[j] : 90;
          const off = (cfg.offsets && typeof cfg.offsets[j]==='number')? cfg.offsets[j] : 0;
          const rel = (ang - 90) + off; angleAccum += rel;
          const L = lengths[j] || 60;
          const style = (cfg.styles && cfg.styles[j]) || 'straight';
          const color = (cfg.colors && cfg.colors[j]) ? cfg.colors[j] : (cfg.color || '#7cc9ff');
          const g = document.createElementNS('http://www.w3.org/2000/svg','g');
          g.setAttribute('transform', `translate(${x},${y}) rotate(${angleAccum})`);
          const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          const barHeight = 12;
          if(style === 'l'){
            rect.setAttribute('x', '0');
            rect.setAttribute('y', String(-Math.round(barHeight/2)));
            rect.setAttribute('width', String(Math.max(6, L)));
            rect.setAttribute('height', String(barHeight));
            rect.setAttribute('fill', color);
            g.appendChild(rect);
            // perpendicular cap at the far end (make cap at least as long as the bar)
            const capThickness = 6;
            const capLength = Math.max(L, 8);
            const cap = document.createElementNS('http://www.w3.org/2000/svg','rect');
            cap.setAttribute('x', String(L - Math.round(capThickness/2)));
            cap.setAttribute('y', String(-Math.round(capLength/2)));
            cap.setAttribute('width', String(capThickness));
            cap.setAttribute('height', String(capLength));
            cap.setAttribute('fill', color);
            g.appendChild(cap);
            // joint marker at far end
            const joint = document.createElementNS('http://www.w3.org/2000/svg','circle');
            joint.setAttribute('cx', String(L)); joint.setAttribute('cy','0'); joint.setAttribute('r','3'); joint.setAttribute('fill','#ffffff'); joint.setAttribute('opacity','0.95');
            g.appendChild(joint);
            root.appendChild(g);
            const theta = angleAccum * Math.PI/180;
            const advance = L;
            x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
          } else {
            rect.setAttribute('x','0');
            rect.setAttribute('y','-6');
            rect.setAttribute('width', String(Math.max(6,L)));
            rect.setAttribute('height','12'); rect.setAttribute('fill', color);
            g.appendChild(rect);
            root.appendChild(g);
            const theta = angleAccum * Math.PI/180;
            const advance = L;
            x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
          }
        });
      }catch(e){ console.warn('drawPreview failed', e); }
    }

    async function savedPositionsLoad(){
      // Try server first, fallback to localStorage
      try{
        const res = await fetch('/api/saved_positions');
        if(res && res.ok){ const j = await res.json(); return j.saved || []; }
      }catch(_){ }
      try{ return JSON.parse(localStorage.getItem('saved_positions')||'[]'); }catch(_){ return []; }
    }
    async function savedPositionsSave(arr){
      // Try server persistence for each item; as a fallback, write localStorage
      try{
        // write full list to server by upserting each item
        for(const it of arr){ try{ await fetch('/api/saved_positions', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: it.name, positions: it.positions }) }); }catch(_){ }
        }
        return;
      }catch(_){ }
      try{ localStorage.setItem('saved_positions', JSON.stringify(arr)); }catch(_){ }
    }

    async function saveCurrentPosition(){
      try{
        const nameEl = document.getElementById('store_name'); const name = nameEl && nameEl.value && nameEl.value.trim(); if(!name){ document.getElementById('storeMsg').textContent='Please enter a name'; return; }
        const pos = Object.assign({}, window.latestPositions || {});
        const payload = { name: name, positions: pos };
        try{
          const res = await fetch('/api/saved_positions', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
          if(res && res.ok){ document.getElementById('storeMsg').textContent='Saved (server)'; await renderSavedLibrary(); return; }
        }catch(_){ }
        // fallback local
        try{
          const arr = JSON.parse(localStorage.getItem('saved_positions')||'[]');
          const idx = arr.findIndex(x=>x.name===name);
          const item = { name: name, positions: pos, ts: Date.now() };
          if(idx>=0) arr[idx] = item; else arr.push(item);
          localStorage.setItem('saved_positions', JSON.stringify(arr));
          document.getElementById('storeMsg').textContent='Saved (local)';
          await renderSavedLibrary();
        }catch(e){ console.warn(e); document.getElementById('storeMsg').textContent='Save failed'; }
      }catch(e){ console.warn(e); }
    }

    async function deleteNamedPosition(){
      try{
        const nameEl = document.getElementById('store_name'); const name = nameEl && nameEl.value && nameEl.value.trim(); if(!name){ document.getElementById('storeMsg').textContent='Enter name to delete'; return; }
        try{
          const res = await fetch('/api/saved_positions', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: name }) });
          if(res && res.ok){ document.getElementById('storeMsg').textContent='Deleted'; await renderSavedLibrary(); return; }
        }catch(_){ }
        // fallback local
        try{ let arr = JSON.parse(localStorage.getItem('saved_positions')||'[]'); arr = arr.filter(x=>x.name!==name); localStorage.setItem('saved_positions', JSON.stringify(arr)); document.getElementById('storeMsg').textContent='Deleted (local)'; await renderSavedLibrary(); }catch(e){ console.warn(e); }
      }catch(e){ console.warn(e); }
    }

    async function renderSavedLibrary(){
      try{
        const lib = document.getElementById('savedLibrary'); if(!lib) return; lib.innerHTML = '';
        const arr = await savedPositionsLoad();
        if(!arr || !arr.length){ lib.innerHTML = '<div style="color:#9fb2c8">No saved positions</div>'; return; }
        arr.forEach(item=>{
          const card = document.createElement('div'); card.style.background='#07202a'; card.style.padding='8px'; card.style.borderRadius='6px'; card.style.cursor='default';
          // center thumbnail and title
          card.style.display = 'flex'; card.style.flexDirection = 'column'; card.style.alignItems = 'center';
          const title = document.createElement('div'); title.textContent = item.name; title.style.fontWeight='700'; title.style.marginBottom='6px'; title.style.textAlign = 'center';
          const pv = document.createElementNS('http://www.w3.org/2000/svg','svg'); pv.setAttribute('width','140'); pv.setAttribute('height','72'); pv.setAttribute('viewBox','0 0 140 72'); pv.style.background='rgba(0,0,0,0.06)'; pv.style.borderRadius='4px';
          // draw preview using the shared drawer but scaled down
          try{ drawPreviewSmall(pv, item.positions || {}); }catch(_){ }
          const pvWrap = document.createElement('div'); pvWrap.style.marginBottom='6px'; pvWrap.style.display='flex'; pvWrap.style.justifyContent='center'; pvWrap.appendChild(pv);
          const btns = document.createElement('div'); btns.style.display='flex'; btns.style.gap='6px';
          const moveBtn = document.createElement('button'); moveBtn.textContent='Move';
          moveBtn.addEventListener('click', ()=>{ moveToSavedPosition(item); });

    // draw a small preview into an existing svg element
    function drawPreviewSmall(svgEl, positions){
      try{
        while(svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
        try{ svgEl.setAttribute('preserveAspectRatio','xMidYMid meet'); }catch(_){ }
        const cfg = (function(){ try{ return JSON.parse(localStorage.getItem('barSchemConfig')||'{}') }catch(_){ return {}; } })();
        const lengths = cfg.lengths || { shoulder:30, elbow:40, wrist:50 };
        const types = cfg.types || {};
        const styles = cfg.styles || {};
        const w = svgEl.clientWidth || parseInt(svgEl.getAttribute('width')) || 140;
        const h = svgEl.clientHeight || parseInt(svgEl.getAttribute('height')) || 72;
        const centerX = Math.round(w*0.15), centerY = Math.round(h/2);
        let x = centerX, y = centerY, angleAccum = 0;
        ['shoulder','elbow','wrist'].forEach((j, idx)=>{
          const ang = (positions && typeof positions[j]==='number')? positions[j] : 90; angleAccum += (ang-90);
          const L = Number(lengths[j]) || [30,40,50][idx];
          const typ = types[j] || 'arm';
          const style = styles[j] || 'straight';
          const color = (cfg.colors && cfg.colors[j]) ? cfg.colors[j] : '#7cc9ff';
          const g = document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('transform', `translate(${x},${y}) rotate(${angleAccum})`);
          const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
          if(typ === 'rotation'){
            const c = document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx','0'); c.setAttribute('cy','0'); c.setAttribute('r','4'); c.setAttribute('fill', color); g.appendChild(c);
            svgEl.appendChild(g);
            // rotations do not advance the chain
            const theta0 = angleAccum*Math.PI/180;
            const advance0 = 0;
            x = x + Math.cos(theta0)*advance0; y = y + Math.sin(theta0)*advance0;
          } else {
            const barH = 6;
            if(style === 'l'){
              rect.setAttribute('x','0');
              rect.setAttribute('y', String(-Math.round(barH/2)));
              rect.setAttribute('width', String(Math.max(6,L)));
              rect.setAttribute('height', String(barH)); rect.setAttribute('fill', color); g.appendChild(rect);
              const capT = 4; const capL = Math.max(L, 6);
              const cap = document.createElementNS('http://www.w3.org/2000/svg','rect');
              cap.setAttribute('x', String(L - Math.round(capT/2)));
              cap.setAttribute('y', String(-Math.round(capL/2)));
              cap.setAttribute('width', String(capT)); cap.setAttribute('height', String(capL)); cap.setAttribute('fill', color); g.appendChild(cap);
              // joint markers at both ends
              const jointStart = document.createElementNS('http://www.w3.org/2000/svg','circle'); jointStart.setAttribute('cx','0'); jointStart.setAttribute('cy','0'); jointStart.setAttribute('r','2'); jointStart.setAttribute('fill','#ffd166'); g.appendChild(jointStart);
              const jointEnd = document.createElementNS('http://www.w3.org/2000/svg','circle'); jointEnd.setAttribute('cx', String(L)); jointEnd.setAttribute('cy','0'); jointEnd.setAttribute('r','2'); jointEnd.setAttribute('fill','#ffd166'); g.appendChild(jointEnd);
              svgEl.appendChild(g);
              const theta = angleAccum*Math.PI/180;
              const advance = L;
              x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
            } else {
              rect.setAttribute('x','0'); rect.setAttribute('y','-3'); rect.setAttribute('width', String(Math.max(6,L))); rect.setAttribute('height','6'); rect.setAttribute('fill', color); g.appendChild(rect);
              svgEl.appendChild(g);
              const theta = angleAccum*Math.PI/180;
              const advance = L;
              x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
            }
          }
        });
      }catch(_){ }
    }

              x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
            } else {
              rect.setAttribute('x', '0'); rect.setAttribute('y','-6'); rect.setAttribute('width', String(Math.max(6,L))); rect.setAttribute('height','12'); rect.setAttribute('fill', color);
              g.appendChild(rect); svg.appendChild(g);
              const theta = ang * Math.PI/180; const advance = L;
              x = x + Math.cos(theta)*advance; y = y + Math.sin(theta)*advance;
            }
            ang += 10*(idx+1);
          }
        });
      }catch(_){ }
    }

    // Build preview setting controls for each joint
    function buildPreviewSettings(joints){
      try{
        const container = document.getElementById('calibPane-preview'); if(!container) return;
        // create a settings area inside the preview pane
        let area = document.getElementById('previewSettings');
        if(!area){ area = document.createElement('div'); area.id = 'previewSettings'; area.style.display = 'flex'; area.style.flexDirection = 'column'; area.style.gap = '8px'; container.appendChild(area); }
        area.innerHTML = '';
        // load current config
        const cfg = (function(){ try{ return JSON.parse(localStorage.getItem('barSchemConfig')||'{}') }catch(_){ return {}; } })();
        cfg.lengths = cfg.lengths || {};
        cfg.types = cfg.types || {};
        cfg.styles = cfg.styles || {};
        cfg.colors = cfg.colors || {};
        joints.forEach(j=>{
          const row = document.createElement('div'); row.style.display='flex'; row.style.gap='8px'; row.style.alignItems='center';
          const lbl = document.createElement('div'); lbl.textContent = j; lbl.style.textTransform='capitalize'; lbl.style.width='90px';
          const typeSel = document.createElement('select'); ['rotation','arm','graber'].forEach(opt=>{ const o = document.createElement('option'); o.value = opt; o.textContent = opt[0].toUpperCase()+opt.slice(1); typeSel.appendChild(o); });
          typeSel.value = cfg.types[j] || (j==='base' ? 'rotation' : (j==='hand' ? 'graber' : 'arm'));
          const styleSel = document.createElement('select'); ['straight','l'].forEach(opt=>{ const o=document.createElement('option'); o.value=opt; o.textContent = (opt==='straight'?'Straight':'L-Style'); styleSel.appendChild(o); });
          styleSel.value = cfg.styles[j] || 'straight';
          const lenInput = document.createElement('input'); lenInput.type='number'; lenInput.value = cfg.lengths[j] || (j==='shoulder'?80:(j==='elbow'?70:50)); lenInput.style.width='80px';
          const colorInput = document.createElement('input'); colorInput.type = 'color'; colorInput.value = cfg.colors[j] || '#7cc9ff'; colorInput.title = 'Bar color';
          // show/hide length/style based on type
          function refreshDisplay(){ const t=typeSel.value; if(t==='arm'){ styleSel.style.display='inline-block'; lenInput.style.display='inline-block'; colorInput.style.display='inline-block'; } else if(t==='graber'){ styleSel.style.display='none'; lenInput.style.display='inline-block'; colorInput.style.display='inline-block'; } else { styleSel.style.display='none'; lenInput.style.display='none'; colorInput.style.display='inline-block'; } }
          typeSel.addEventListener('change', ()=>{ cfg.types[j]=typeSel.value; refreshDisplay(); localStorage.setItem('barSchemConfig', JSON.stringify(cfg)); drawCalibPreview(); });
          styleSel.addEventListener('change', ()=>{ cfg.styles[j]=styleSel.value; localStorage.setItem('barSchemConfig', JSON.stringify(cfg)); drawCalibPreview(); });
          lenInput.addEventListener('input', ()=>{ cfg.lengths[j]=Number(lenInput.value)||0; localStorage.setItem('barSchemConfig', JSON.stringify(cfg)); drawCalibPreview(); });
          colorInput.addEventListener('input', ()=>{ cfg.colors[j]=colorInput.value; localStorage.setItem('barSchemConfig', JSON.stringify(cfg)); drawCalibPreview(); });
          refreshDisplay();
          row.appendChild(lbl); row.appendChild(typeSel); row.appendChild(styleSel); row.appendChild(lenInput); row.appendChild(colorInput);
          area.appendChild(row);
        });
      }catch(e){ console.warn('buildPreviewSettings failed', e); }
    }

    async function saveAllCalib(){
      try{
        // If we have a draft, iterate its joints and POST updates for each
        const draft = window._calibDraft;
        if(draft && (draft.limits || draft.home || draft.step || draft.pulse || draft.motion || draft.reverse)){
          const joints = Object.keys(draft.limits || draft.home || draft.step || draft.pulse || draft.motion || draft.reverse || {});
          // ensure we include all keys present in any section (including motion & reverse)
          const extras = new Set(joints);
          ['limits','home','step','pulse','motion','reverse'].forEach(k=>{ if(draft[k]) Object.keys(draft[k]).forEach(j=>extras.add(j)); });
          const allJoints = Array.from(extras);
          for(const j of allJoints){
            try{
              // prefer live DOM values if the calibration modal is open and this joint is currently selected
              let payload = null;
              try{
                const modal = document.getElementById('calibModal');
                const sel = modal && modal.querySelector && modal.querySelector('#calib_motor_select');
                const selectedJoint = sel && sel.value;
                if(modal && modal.style && modal.style.display !== 'none' && selectedJoint === j){
                  // read inputs directly to capture typed-but-unblurred values
                  const vmin = document.getElementById('fld_min') && document.getElementById('fld_min').value;
                  const vmax = document.getElementById('fld_max') && document.getElementById('fld_max').value;
                  const vstep = document.getElementById('fld_step') && document.getElementById('fld_step').value;
                  const vhome = document.getElementById('fld_home') && document.getElementById('fld_home').value;
                  const vpmin = document.getElementById('fld_pmin') && document.getElementById('fld_pmin').value;
                  const vpmax = document.getElementById('fld_pmax') && document.getElementById('fld_pmax').value;
                  const vmin_dps = document.getElementById('fld_min_dps') && document.getElementById('fld_min_dps').value;
                  const vmax_dps = document.getElementById('fld_max_dps') && document.getElementById('fld_max_dps').value;
                  const vstep_int = document.getElementById('fld_step_interval') && document.getElementById('fld_step_interval').value;
                  const vrev = document.getElementById('fld_rev') && document.getElementById('fld_rev').checked;
                  payload = { joint: j, min: Number(vmin||0), max: Number(vmax||180), step: Number(vstep||5), home: Number(vhome||(j==='hand'?0:90)) };
                  if(vpmin) payload.pulse_min = Number(vpmin);
                  if(vpmax) payload.pulse_max = Number(vpmax);
                  if(vmin_dps) payload.min_dps = Number(vmin_dps);
                  if(vmax_dps) payload.max_dps = Number(vmax_dps);
                  if(vstep_int) payload.step_interval = Number(vstep_int);
                  // speed mode DPS
                  if(document.getElementById('fld_speed_slow') && document.getElementById('fld_speed_slow').value) payload.speed_slow = Number(document.getElementById('fld_speed_slow').value);
                  if(document.getElementById('fld_speed_medium') && document.getElementById('fld_speed_medium').value) payload.speed_medium = Number(document.getElementById('fld_speed_medium').value);
                  if(document.getElementById('fld_speed_fast') && document.getElementById('fld_speed_fast').value) payload.speed_fast = Number(document.getElementById('fld_speed_fast').value);
                  payload.reverse = !!vrev;
                }
              }catch(_){ payload = null; }

              // fallback to draft values if no live DOM values were read
              if(!payload){
                const lim = (draft.limits && draft.limits[j]) || [0,180];
                payload = { joint: j, min: Number(lim[0]||0), max: Number(lim[1]||180), step: Number((draft.step && draft.step[j])||5), home: Number((draft.home && draft.home[j])||(j==='hand'?0:90)) };
                if(draft.pulse && draft.pulse[j]){
                  if(typeof draft.pulse[j].min_pulse !== 'undefined') payload.pulse_min = Number(draft.pulse[j].min_pulse);
                  if(typeof draft.pulse[j].max_pulse !== 'undefined') payload.pulse_max = Number(draft.pulse[j].max_pulse);
                }
                if(draft.motion && draft.motion[j]){
                  if(typeof draft.motion[j].min_dps !== 'undefined') payload.min_dps = Number(draft.motion[j].min_dps);
                  if(typeof draft.motion[j].max_dps !== 'undefined') payload.max_dps = Number(draft.motion[j].max_dps);
                  if(typeof draft.motion[j].step_interval !== 'undefined') payload.step_interval = Number(draft.motion[j].step_interval);
                  // draft speed_modes
                  try{ if(draft.motion[j].speed_modes){ const sm = draft.motion[j].speed_modes; if(typeof sm.slow !== 'undefined') payload.speed_slow = Number(sm.slow); if(typeof sm.medium !== 'undefined') payload.speed_medium = Number(sm.medium); if(typeof sm.fast !== 'undefined') payload.speed_fast = Number(sm.fast); } }catch(_){ }
                }
                try{ payload.reverse = !!(draft.reverse && draft.reverse[j]); }catch(_){ payload.reverse = false; }
              }

              await fetch('/api/calibration/update', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{});
            }catch(_){ }
          }
          // server persists reverse flags now; no localStorage needed
          // persist once
          try{ await fetch('/api/calibration/save', { method:'POST' }).catch(()=>{}); }catch(_){ }
          try{ showCalibMessage && showCalibMessage('Saved'); }catch(_){ }
        }
        closeCalibModal();
      }catch(e){ console.warn('saveAllCalib failed', e); }
    }

    // small helper: show a transient message in the calibration modal
    function showCalibMessage(msg, timeout=3000){
      try{
        let modal = document.getElementById('calibModal'); if(!modal) return;
        let cont = modal.querySelector && modal.querySelector('.calib-msg');
        if(!cont){ cont = document.createElement('div'); cont.className='calib-msg'; cont.style.position='absolute'; cont.style.right='18px'; cont.style.top='18px'; cont.style.padding='6px 10px'; cont.style.background='rgba(0,0,0,0.6)'; cont.style.border='1px solid rgba(255,255,255,0.04)'; cont.style.borderRadius='6px'; cont.style.color='#bfeaf5'; cont.style.fontSize='13px'; cont.style.zIndex='1300'; modal.querySelector('#calibOverlay > div').appendChild(cont); }
        cont.textContent = msg;
        cont.style.opacity = '1';
        if(cont._tm) clearTimeout(cont._tm);
        cont._tm = setTimeout(()=>{ try{ cont.style.opacity = '0'; }catch(_){ } }, timeout);
      }catch(_){ }
    }

    // Apply the currently selected motor settings immediately but do NOT persist to disk.
    // This lets the user 'try' calibration changes live in the setup UI.
    async function tempSaveCalib(){
      try{
        const modal = document.getElementById('calibModal'); if(!modal) return;
        const sel = modal.querySelector && modal.querySelector('#calib_motor_select'); if(!sel) return;
        const joint = sel.value;
        // read DOM fields for the selected joint
        const vmin = document.getElementById('fld_min') && document.getElementById('fld_min').value;
        const vmax = document.getElementById('fld_max') && document.getElementById('fld_max').value;
        const vstep = document.getElementById('fld_step') && document.getElementById('fld_step').value;
        const vhome = document.getElementById('fld_home') && document.getElementById('fld_home').value;
        const vpmin = document.getElementById('fld_pmin') && document.getElementById('fld_pmin').value;
        const vpmax = document.getElementById('fld_pmax') && document.getElementById('fld_pmax').value;
        const vmin_dps = document.getElementById('fld_min_dps') && document.getElementById('fld_min_dps').value;
        const vmax_dps = document.getElementById('fld_max_dps') && document.getElementById('fld_max_dps').value;
        const vstep_int = document.getElementById('fld_step_interval') && document.getElementById('fld_step_interval').value;
        const vrev = document.getElementById('fld_rev') && document.getElementById('fld_rev').checked;
        const payload = { joint: joint, min: Number(vmin||0), max: Number(vmax||180), step: Number(vstep||5), home: Number(vhome||(joint==='hand'?0:90)) };
        if(vpmin) payload.pulse_min = Number(vpmin);
        if(vpmax) payload.pulse_max = Number(vpmax);
        if(vmin_dps) payload.min_dps = Number(vmin_dps);
        if(vmax_dps) payload.max_dps = Number(vmax_dps);
        if(vstep_int) payload.step_interval = Number(vstep_int);
        if(document.getElementById('fld_speed_slow') && document.getElementById('fld_speed_slow').value) payload.speed_slow = Number(document.getElementById('fld_speed_slow').value);
        if(document.getElementById('fld_speed_medium') && document.getElementById('fld_speed_medium').value) payload.speed_medium = Number(document.getElementById('fld_speed_medium').value);
        if(document.getElementById('fld_speed_fast') && document.getElementById('fld_speed_fast').value) payload.speed_fast = Number(document.getElementById('fld_speed_fast').value);
        payload.reverse = !!vrev;

        // POST update without calling /api/calibration/save — so changes apply immediately but are not persisted
        await fetch('/api/calibration/update', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{});
        // update local draft so UI reflects temp values
        try{ window._calibDraft = window._calibDraft || {}; window._calibDraft.motion = window._calibDraft.motion || {}; window._calibDraft.motion[joint] = window._calibDraft.motion[joint] || {}; if(typeof payload.min_dps !== 'undefined') window._calibDraft.motion[joint].min_dps = payload.min_dps; if(typeof payload.max_dps !== 'undefined') window._calibDraft.motion[joint].max_dps = payload.max_dps; if(typeof payload.step_interval !== 'undefined') window._calibDraft.motion[joint].step_interval = payload.step_interval; window._calibDraft.reverse = window._calibDraft.reverse || {}; window._calibDraft.reverse[joint] = payload.reverse; }catch(_){ }
        console.log('Temp saved calibration for', joint);
      }catch(e){ console.warn('tempSaveCalib failed', e); }
    }

    function buildControls(){
      try{
        const container = document.getElementById('controlsList'); if(!container) return; container.innerHTML = '';
        // Keep a persistent controlsMap so we can update inputs in-place when server reports moves
        window.controlsMap = window.controlsMap || {};
        JOINT_ORDER.forEach(j=>{
          const card = document.createElement('div'); card.className='control-card';
          const label = document.createElement('div'); label.textContent = j; label.style.textTransform='capitalize'; label.style.marginBottom='6px';
          const row = document.createElement('div'); row.className='slider-row';
          const input = document.createElement('input'); input.type='range'; input.min='0'; input.max='180'; input.value = window.latestPositions[j] || 90;
          const val = document.createElement('div'); val.className='angle-val'; val.textContent = input.value + '°';
          // smooth live control: send throttled updates while dragging, send immediate on change
          input.addEventListener('input', ()=>{
            val.textContent = input.value + '°';
            window.latestPositions[j] = Number(input.value);
            drawBarSchematic();
            // throttle live send
            try{
              const cmap = window.controlsMap = window.controlsMap || {};
              const entry = cmap[j] = cmap[j] || {};
              if(entry._liveTimer) clearTimeout(entry._liveTimer);
              entry._liveTimer = setTimeout(()=>{
                  if(window.IS_LIVE){ try{ const mode = window.GLOBAL_SPEED_MODE || 'medium'; sendTarget(j, Number(input.value), null, mode); }catch(_){ } }
                entry._liveTimer = null;
              }, 200);
            }catch(_){ }
          });
          input.addEventListener('change', ()=>{
            try{ if(window.controlsMap && window.controlsMap[j] && window.controlsMap[j]._liveTimer){ clearTimeout(window.controlsMap[j]._liveTimer); window.controlsMap[j]._liveTimer = null; } }catch(_){ }
            try{ const mode = window.GLOBAL_SPEED_MODE || 'medium'; sendMove(j, Number(input.value), mode); }catch(_){ sendMove(j, Number(input.value)); }
            try{ localStorage.setItem('simPositions', JSON.stringify(window.latestPositions)); }catch(_){ }
          });
          // track user interaction to avoid server updates overriding slider while dragging
          input.addEventListener('pointerdown', ()=>{ try{ window.controlsMap = window.controlsMap || {}; window.controlsMap[j] = window.controlsMap[j] || {}; window.controlsMap[j].dragging = true; }catch(_){ } });
          input.addEventListener('pointerup', ()=>{ try{ const e=window.controlsMap && window.controlsMap[j]; if(e){ e.dragging = false; } }catch(_){ } try{ if(window.IS_LIVE){ const mode = (window.controlsMap && window.controlsMap[j] && window.controlsMap[j].speedMode) || 'medium'; sendMove(j, Number(input.value), mode); } }catch(_){ } });
          // put slider and value in the row
          row.appendChild(input); row.appendChild(val);
          // row already appended
          card.appendChild(label); card.appendChild(row); container.appendChild(card);
          // store references for later updates
          window.controlsMap[j] = { slider: input, valEl: val };
        });
      }catch(e){ console.warn('buildControls failed', e); }
    }

    // initial
    try{ buildControls(); drawBarSchematic(); }catch(_){ }

    // wire global speed selector in header
    try{
      const gsel = document.getElementById('globalSpeedSel');
      window.GLOBAL_SPEED_MODE = (gsel && gsel.value) || 'medium';
      if(gsel){ gsel.addEventListener('change', ()=>{ window.GLOBAL_SPEED_MODE = gsel.value; }); }
    }catch(_){ window.GLOBAL_SPEED_MODE = 'medium'; }

    // wire new store position top button
    try{ const sp = document.getElementById('storePosBtn'); if(sp) sp.addEventListener('click', openStoreModal); }catch(_){ }

    // basic buttons
    try{ const setup = document.getElementById('setupBtn'); if(setup) setup.addEventListener('click', openCalibModal); }catch(_){ }
    try{ const home = document.getElementById('homeBtn'); if(home) home.addEventListener('click', ()=>{
        try{
          if(window.IS_LIVE){
            // Live: command the real robot
            fetch('/api/home',{method:'POST'}).catch(()=>{});
          } else {
            // Simulation: reset local simulated positions and update UI
            try{ window.latestPositions = Object.assign({}, DEFAULT_POS); }catch(_){ window.latestPositions = Object.assign({}, DEFAULT_POS); }
            try{ localStorage.setItem('simPositions', JSON.stringify(window.latestPositions)); }catch(_){ }
            try{ buildControls(); drawBarSchematic(); }catch(_){ }
          }
        }catch(_){ }
      }); }catch(_){ }
    try{ const em = document.getElementById('emergencyBtn'); if(em) em.addEventListener('click', ()=>fetch('/api/emergency',{method:'POST'}).catch(()=>{})); }catch(_){ }
    try{ const mode = document.getElementById('modeToggleBtn'); if(mode) mode.addEventListener('click', ()=>{ window.IS_LIVE = !window.IS_LIVE; mode.textContent = 'Mode: ' + (window.IS_LIVE ? 'Live' : 'Simulation'); if(window.IS_LIVE){ try{ fetchStatus(); }catch(_){ } } }); }catch(_){ }

    // 3D viewer modal wiring
    try{
      const o3 = document.getElementById('open3dBtn'); const modal3 = document.getElementById('viewerModal3d'); const close3 = document.getElementById('close3dBtn');
      if(o3 && modal3){ o3.addEventListener('click', ()=>{ modal3.style.display = 'flex'; document.getElementById('viewerIframe3d').src = '/block_arm'; }); }
      if(close3 && modal3){ close3.addEventListener('click', ()=>{ modal3.style.display = 'none'; document.getElementById('viewerIframe3d').src = 'about:blank'; }); }
    }catch(_){ }

    // helper hooks for server updates (kept for compatibility)
    window.updateControlsFromPositions = function(positions){ try{
        if(!positions) return;
        // merge positions into latestPositions
        window.latestPositions = Object.assign({}, window.latestPositions, positions || {});
        // update inputs in-place where possible to avoid rebuilding DOM
        try{
          const cmap = window.controlsMap || {};
          JOINT_ORDER.forEach(j=>{
            try{
              const val = (window.latestPositions && typeof window.latestPositions[j] === 'number') ? window.latestPositions[j] : null;
              if(val === null) return;
              const entry = cmap[j];
              if(entry && entry.slider){
                // don't override while user is dragging this control
                if(entry.dragging) return;
                // map server value to displayed UI value (respect reverse)
                const display = (typeof val === 'number') ? _mapFromServer(j, val) : val;
                const cur = Number(entry.slider.value);
                if(cur !== Number(display)){
                  entry.slider.value = Number(display);
                  if(entry.valEl) entry.valEl.textContent = Number(display) + '°';
                }
              }
            }catch(_){ }
          });
        }catch(_){ }
        // redraw schematic
        try{ drawBarSchematic(); }catch(_){ }
      }catch(e){ console.warn('updateControlsFromPositions failed', e); } };

    // Polling loop: always poll server for status (hardware + positions). Update header and controls.
    function fetchStatus(){
      return fetch('/api/status').then(r=>r.json()).then(data=>{
        try{
          const ok = data && !!data.hardware_available;
          const statusEl = document.getElementById('headerStatus');
          if(statusEl){
            statusEl.textContent = ok ? '✅' : '❌';
            let tip = `${window.location.host} · hardware: ${ok ? 'OK' : 'Offline'}`;
            if(data.positions) tip += ` · joints:${Object.keys(data.positions).length}`;
            statusEl.title = tip;
            statusEl.style.color = ok ? '#9ee6a0' : '#ff8b8b';
          }
          const positions = data.positions || {};
          if(window.IS_LIVE){ try{ window.updateControlsFromPositions(positions); }catch(_){ } }
        }catch(_){ }
      }).catch(()=>{});
    }

    (function startPolling(){
      // immediate fetch then interval
      try{ fetchStatus(); }catch(_){ }
      setInterval(()=>{ try{ fetchStatus(); }catch(_){ } }, 800);
    })();

    // Wire header buttons (ensure topbar Library button opens the store modal)
    try{
      const libTop = document.getElementById('libraryBtn');
      if(libTop) libTop.addEventListener('click', ()=>{ openStoreModal(); });
      const storeTop = document.getElementById('storePosBtn');
      if(storeTop) storeTop.addEventListener('click', ()=>{ openStoreModal(); });
    }catch(_){ }

  })();
  </script>
